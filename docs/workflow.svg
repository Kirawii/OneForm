<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">OneForm 工作流</title>
  <desc id="desc">集中填写资料，自动生成格式，搜索并复制，粘贴到各院校报名系统，最后核对提交。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa09a"/>
    </marker>
    <style>
      .ui{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .title{fill:#20211f;font-size:18px;font-weight:720}.copy{fill:#74766f;font-size:12px}
      .num{fill:#2366d1;font-size:11px;font-weight:760;letter-spacing:1px}
      .white{fill:#fff}.soft{fill:#dce8ff}
    </style>
  </defs>
  <rect width="1200" height="300" rx="24" fill="#f5f5f2"/>
  <path d="M238 150H286 M466 150H514 M694 150H742 M922 150H970" stroke="#9aa09a" stroke-width="2" marker-end="url(#arrow)"/>
  <g class="ui">
    <rect x="38" y="76" width="200" height="148" rx="17" fill="#fff" stroke="#dedfd9"/>
    <text x="62" y="107" class="num">01 / COLLECT</text>
    <text x="62" y="145" class="title">集中填写资料</text>
    <text x="62" y="173" class="copy">把重复字段统一整理</text>
    <text x="62" y="194" class="copy">只维护一份可信底稿</text>

    <rect x="266" y="76" width="200" height="148" rx="17" fill="#fff" stroke="#dedfd9"/>
    <text x="290" y="107" class="num">02 / FORMAT</text>
    <text x="290" y="145" class="title">生成常用格式</text>
    <text x="290" y="173" class="copy">日期、姓名与排名口径</text>
    <text x="290" y="194" class="copy">由基础字段自动派生</text>

    <rect x="494" y="76" width="200" height="148" rx="17" fill="#fff" stroke="#dedfd9"/>
    <text x="518" y="107" class="num">03 / COPY</text>
    <text x="518" y="145" class="title">搜索并复制</text>
    <text x="518" y="173" class="copy">单字段、表格或整区</text>
    <text x="518" y="194" class="copy">按报名页面随用随取</text>

    <rect x="722" y="76" width="200" height="148" rx="17" fill="#fff" stroke="#dedfd9"/>
    <text x="746" y="107" class="num">04 / APPLY</text>
    <text x="746" y="145" class="title">粘贴到报名系统</text>
    <text x="746" y="173" class="copy">适配不同院校的字段</text>
    <text x="746" y="194" class="copy">减少反复查找和输入</text>

    <rect x="950" y="76" width="212" height="148" rx="17" fill="#2366d1"/>
    <text x="974" y="107" class="num soft">05 / VERIFY</text>
    <text x="974" y="145" class="title white">核对后提交</text>
    <text x="974" y="173" class="copy soft">检查材料、口径和文件</text>
    <text x="974" y="194" class="copy soft">最终以院校官网为准</text>
  </g>
</svg>
