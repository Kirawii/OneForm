<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">OneForm 界面预览</title>
  <desc id="desc">浅色资料页：左侧目录，右侧搜索、更多菜单与基本信息。示意图不含个人资料。</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#20211f;font-size:17px}
    .muted{fill:#74766f;font-size:14px}.heading{font-size:21px;font-weight:600}
    .input{fill:#fafaf8}.panel{fill:white;stroke:#dedfd9}
    .copy{fill:none;stroke:#74766f;stroke-width:1.5}
  </style>
  <defs><g id="copy" class="copy"><rect x="7" y="7" width="9" height="10" rx="2"/><path d="M12 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h2"/></g></defs>
  <rect width="1440" height="900" rx="24" fill="#f5f5f2"/>
  <rect class="panel" x="30" y="30" width="258" height="840" rx="17"/>
  <text x="54" y="77" font-size="25" font-weight="650">OneForm</text>
  <text x="54" y="105" class="muted">填写一次，随用随复制。</text>
  <path d="M54 128H264" stroke="#dedfd9"/>
  <text x="54" y="164" class="muted">资料完整度</text><text x="239" y="164" class="muted">0%</text>
  <rect x="54" y="178" width="210" height="5" rx="3" fill="#f1f2ef"/>
  <rect x="44" y="207" width="230" height="42" rx="10" fill="#eaf1ff"/>
  <text x="62" y="234" style="fill:#2366d1">基本信息</text>
  <text x="62" y="280">家庭主要成员</text><text x="62" y="326">学习信息</text>
  <text x="62" y="372">外语水平</text><text x="62" y="418">实践经历</text>
  <text x="62" y="464">学术成果</text><text x="62" y="510">奖励情况</text>
  <text x="62" y="556">自定义字段</text><text x="62" y="602">申请信息</text>
  <text x="62" y="648">推荐人信息</text><text x="62" y="694">上传材料</text>
  <text x="62" y="740">提交前检查</text>
  <text x="54" y="813" class="muted">资料保存在当前浏览器。</text>
  <text x="54" y="838" class="muted">换设备前，请下载备份。</text>
  <text x="316" y="70" style="font-size:28px;font-weight:650">我的资料</text>
  <rect class="panel" x="310" y="94" width="1100" height="66" rx="15"/>
  <rect class="panel" x="324" y="107" width="880" height="40" rx="10"/>
  <text x="342" y="134" class="muted">⌕　搜索资料，如成绩、竞赛、导师</text>
  <rect class="panel" x="1218" y="107" width="76" height="40" rx="10"/><text x="1239" y="134" class="muted">保存</text>
  <rect class="panel" x="1307" y="107" width="88" height="40" rx="10"/><text x="1335" y="134" class="muted">更多</text>
  <rect class="panel" x="310" y="180" width="1100" height="555" rx="17"/>
  <text x="338" y="222" class="heading">基本信息</text><text x="1314" y="222" class="muted">复制本节</text>
  <g transform="translate(338 265)">
    <text y="0">姓名</text><use href="#copy" x="304" y="-18"/><rect class="input" y="15" width="325" height="47" rx="9"/>
    <text y="108">民族</text><use href="#copy" x="304" y="90"/><rect class="input" y="123" width="325" height="47" rx="9"/>
    <text y="216">现役军人码</text><use href="#copy" x="304" y="198"/><rect class="input" y="231" width="325" height="47" rx="9"/>
    <text y="324">通讯地址</text><use href="#copy" x="304" y="306"/><rect class="input" y="339" width="325" height="47" rx="9"/>
  </g>
  <g transform="translate(693 265)">
    <text>姓名拼音</text><use href="#copy" x="304" y="-18"/><rect class="input" y="15" width="325" height="47" rx="9"/>
    <text y="108">性别</text><use href="#copy" x="304" y="90"/><rect class="input" y="123" width="325" height="47" rx="9"/>
    <text y="216">出生地</text><use href="#copy" x="304" y="198"/><rect class="input" y="231" width="325" height="47" rx="9"/>
    <text y="324">移动电话</text><use href="#copy" x="304" y="306"/><rect class="input" y="339" width="325" height="47" rx="9"/>
  </g>
  <g transform="translate(1048 265)">
    <text>证件号码</text><use href="#copy" x="304" y="-18"/><rect class="input" y="15" width="325" height="47" rx="9"/>
    <text y="108">政治面貌</text><use href="#copy" x="304" y="90"/><rect class="input" y="123" width="325" height="47" rx="9"/>
    <text y="216">籍贯地</text><use href="#copy" x="304" y="198"/><rect class="input" y="231" width="325" height="47" rx="9"/>
    <text y="324">电子邮箱</text><use href="#copy" x="304" y="306"/><rect class="input" y="339" width="325" height="47" rx="9"/>
  </g>
  <rect class="panel" x="310" y="756" width="1100" height="114" rx="17"/>
  <text x="338" y="801" class="heading">家庭主要成员</text>
  <text x="338" y="834" class="muted">按报名要求填写家庭成员信息。</text>
  <text x="1314" y="801" class="muted">复制表格</text>
</svg>
